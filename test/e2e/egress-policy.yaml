# A probe actor's egress policy, created by hack/e2e-kind.sh, which substitutes
# TARGET_HOST and CREDENTIAL_URI: cleartext HTTP to the echo target, with the
# Authorization header the actor sends replaced by the URI's secret.
rules:
- http:
    hostnames: ["TARGET_HOST"]
    effects:
      replaceHeaders:
      - header: Authorization
        prefix: "Bearer "
        credentialUri: CREDENTIAL_URI
