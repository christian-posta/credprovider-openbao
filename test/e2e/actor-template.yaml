# The probe ActorTemplate, created in each test atespace by hack/e2e-kind.sh,
# which substitutes ATESPACE and PROBE_IMAGE.
metadata:
  atespace: ATESPACE
  name: probe
workerSelector:
  matchLabels:
    workload: openbao-e2e
containers:
- name: probe
  image: PROBE_IMAGE
  command: ["/ko-app/probe"]
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 268435456 # 256Mi
snapshotConfig:
  # Cold starts are fast enough for the test; no golden snapshot to wait for.
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
