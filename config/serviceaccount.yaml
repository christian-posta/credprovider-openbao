# The pod identity certificate names this ServiceAccount:
#   spiffe://cluster.local/ns/credprovider-openbao/sa/openbao-credential-provider
# substrate must be installed with that ID in ATE_EGRESS_GATEWAY_EXTRA_SPIFFE_IDS
# so ateapi lets the provider mint actor JWTs. The ServiceAccount needs no
# Kubernetes RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-credential-provider
  namespace: credprovider-openbao
automountServiceAccountToken: false
