# The provider with --openbao-auth=actor-jwt, as provider "openbao-actor" in
# namespace credprovider-openbao-actor, next to the default one. It logs in to
# OpenBao as each actor with an actor JWT it mints through ateapi, so:
#
#   - ate-api-server must grant its identity the egress_gateway role:
#     spiffe://cluster.local/ns/credprovider-openbao-actor/sa/openbao-credential-provider
#   - its namespace carries ate.dev/api-access, which ate-system's
#     NetworkPolicy requires to reach ateapi;
#   - it presents a podidentity certificate to ateapi.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
namespace: credprovider-openbao-actor
patches:
- target:
    kind: Namespace
    name: credprovider-openbao
  patch: |-
    - op: replace
      path: /metadata/name
      value: credprovider-openbao-actor
    - op: add
      path: /metadata/labels
      value:
        ate.dev/api-access: "true"
- target:
    kind: Deployment
    name: openbao-credential-provider
  path: deployment-patch.yaml
