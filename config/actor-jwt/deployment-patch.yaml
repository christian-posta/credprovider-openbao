# Replaces the default deployment's arguments and volumes. The arguments and
# the podidentity volume differ; the openbao-token volume goes.
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
  - "--listen-address=:50051"
  - "--health-address=:9090"
  - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
  - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
  - "--injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress"
  # Mint actor JWTs through ateapi, authenticating with this pod's identity
  # certificate, and log in to OpenBao's JWT auth method with them.
  - "--openbao-auth=actor-jwt"
  - "--openbao-auth-mount=jwt"
  - "--openbao-role=substrate-actor"
  - "--actor-jwt-audience=openbao"
  - "--ateapi-address=dns:///api.ate-system.svc:443"
  - "--ateapi-server-name=api.ate-system.svc"
  - "--ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem"
  - "--ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem"
  - "--openbao-address=https://openbao.openbao.svc:8200"
  - "--openbao-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem"
  - "--provider-name=openbao-actor"
  - "--log-level=info"
- op: replace
  path: /spec/template/spec/containers/0/volumeMounts
  value:
  - name: servicedns
    mountPath: /run/servicedns.podcert.ate.dev
    readOnly: true
  - name: podidentity
    mountPath: /run/podidentity.podcert.ate.dev
    readOnly: true
- op: replace
  path: /spec/template/spec/volumes
  value:
  # The serving certificate, and the CA that ateapi's and OpenBao's serving
  # certificates chain to.
  - name: servicedns
    projected:
      sources:
      - podCertificate:
          signerName: servicedns.podcert.ate.dev/identity
          keyType: ECDSAP256
          credentialBundlePath: credential-bundle.pem
      - clusterTrustBundle:
          signerName: servicedns.podcert.ate.dev/identity
          labelSelector:
            matchLabels:
              podcert.ate.dev/canarying: live
          path: trust-bundle.pem
  # This pod's SPIFFE identity, presented to ateapi, and the CA that the egress
  # gateway's client certificate chains to.
  - name: podidentity
    projected:
      sources:
      - podCertificate:
          signerName: podidentity.podcert.ate.dev/identity
          keyType: ECDSAP256
          credentialBundlePath: credential-bundle.pem
      - clusterTrustBundle:
          signerName: podidentity.podcert.ate.dev/identity
          labelSelector:
            matchLabels:
              podcert.ate.dev/canarying: live
          path: trust-bundle.pem
