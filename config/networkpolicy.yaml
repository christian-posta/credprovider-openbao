# Only the egress gateway may reach the gRPC port. mTLS pins the gateway's
# identity too; this keeps everything else from even connecting. The kubelet
# reaches the health port for probes regardless of NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-credential-provider
  namespace: credprovider-openbao
spec:
  podSelector:
    matchLabels:
      app: openbao-credential-provider
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ate-system
      podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 50051
