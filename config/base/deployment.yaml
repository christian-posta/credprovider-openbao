apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-credential-provider
  namespace: credprovider-openbao
  labels:
    app: openbao-credential-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao-credential-provider
  template:
    metadata:
      labels:
        app: openbao-credential-provider
    spec:
      serviceAccountName: openbao-credential-provider
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
      - name: openbao-credential-provider
        image: ko://plugins.go.ate.dev/credprovider-openbao/cmd/openbao-credential-provider
        args:
        - "--listen-address=:50051"
        - "--health-address=:9090"
        # A servicedns certificate for
        # openbao-credential-provider.<namespace>.svc, the name the egress
        # gateway pins when it dials the provider.
        - "--server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
        # Admit only the egress gateway (atenet-egress in ate-system). Change
        # the namespace if substrate runs elsewhere.
        - "--client-ca-file=/run/podidentity.podcert.ate.dev/trust-bundle.pem"
        - "--injector-identity=spiffe://cluster.local/ns/ate-system/sa/atenet-egress"
        # Log in to OpenBao's Kubernetes auth method as this pod's
        # ServiceAccount, with the token projected below.
        - "--openbao-auth=kubernetes"
        - "--openbao-auth-mount=kubernetes"
        - "--openbao-role=substrate-credential-provider"
        - "--service-account-token-file=/var/run/secrets/openbao/token"
        # OpenBao, and the trust bundle its serving certificate chains to.
        # hack/kind/openbao.yaml serves a servicedns certificate; point these at
        # your own OpenBao and its CA otherwise.
        - "--openbao-address=https://openbao.openbao.svc:8200"
        - "--openbao-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem"
        - "--provider-name=openbao"
        - "--log-level=info"
        ports:
        - name: grpc
          containerPort: 50051
        - name: health
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: openbao-token
          mountPath: /var/run/secrets/openbao
          readOnly: true
      volumes:
      # The serving certificate, issued for the Services that select this pod,
      # and the CA that OpenBao's serving certificate chains to.
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      # The CA that the egress gateway's client certificate chains to.
      - name: podidentity
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      # This pod's ServiceAccount token, bound to OpenBao's audience, which
      # OpenBao verifies with a TokenReview. The kubelet rotates it.
      - name: openbao-token
        projected:
          sources:
          - serviceAccountToken:
              audience: openbao
              expirationSeconds: 600
              path: token
